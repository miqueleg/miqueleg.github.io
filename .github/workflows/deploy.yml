name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC: refresh publications and repos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Weekly (and on manual runs): pull ORCID/OpenAlex and GitHub data, commit any change.
      # Pushes made with GITHUB_TOKEN don't retrigger this workflow; the build below uses the new data.
      - name: Sync publications and repositories
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-publications.mjs
          node scripts/sync-repos.mjs
          if ! git diff --quiet -- src/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "Update publications and repositories"
            git push
          fi

      - run: npm run build

      # Same target as the old al-folio site: the gh-pages branch, so Pages settings stay unchanged.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
